services:
  - type: web
    name: habblaud-miniapp
    runtime: docker
    plan: free
    branch: feat/telegram-miniapp
    dockerfilePath: ./miniapp/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "4849"
      - key: TG_BOT_API_TOKEN
        sync: false
      - key: TG_USER_ID
        sync: false
      - key: MINIAPP_BRIDGE_SECRET
        generateValue: true
