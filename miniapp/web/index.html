<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <title>Habblaud</title>
  <link rel="icon" href="/brand.png">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></symbol>
    <symbol id="icon-projects" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
    <symbol id="icon-office" viewBox="0 0 24 24"><path d="M5 21V5l7-2v18m0-14h7v14M3 21h18M8.5 7v1m0 3v1m0 3v1m7-5v1m0 3v1"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5m11-1a8 8 0 0 0-14-5m-2 7a8 8 0 0 0 14 5"/></symbol>
    <symbol id="icon-waiting" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5m0 3h.01"/></symbol>
    <symbol id="icon-codex" viewBox="0 0 24 24"><path d="m7 8 4 4-4 4m6 0h4"/></symbol>
    <symbol id="icon-claude" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16M6.3 6.3l11.4 11.4m0-11.4L6.3 17.7"/></symbol>
  </svg>
  <div class="workspace">
    <header class="masthead">
      <div class="brand"><img src="/brand.png" alt="" width="34" height="34"><span>Habblaud</span></div>
      <span id="preview" class="preview" data-i18n="Prévia" hidden></span>
      <button id="sync" class="sync" type="button" data-state="loading" disabled>
        <span class="dot"></span><span id="sync-label" data-i18n="Conectando"></span>
        <svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg>
      </button>
    </header>
    <div id="connection" class="connection" role="status" hidden></div>
    <main>
      <section id="overview" class="screen" aria-labelledby="overview-title">
        <div class="page-head">
          <h1 id="overview-title" data-i18n="Painel"></h1>
          <p id="overview-meta" data-i18n="Carregando sessões…"></p>
        </div>
        <div class="hero">
          <div class="hero-copy">
            <p class="hero-label" data-i18n="Escritório ao vivo"></p>
            <div class="hero-value"><strong id="working-count">–</strong><span data-i18n="em atividade"></span></div>
            <p id="hero-meta" class="hero-meta"></p>
          </div>
          <img src="/office.png" alt="" width="960" height="540" class="hero-art">
        </div>
        <div id="metrics" class="metrics"></div>
        <section class="section" aria-labelledby="waiting-title">
          <div class="section-head">
            <h2 id="waiting-title" data-i18n="Precisa de você"></h2>
            <span id="waiting-count" class="count waiting-count" hidden></span>
          </div>
          <div id="waiting-list"></div>
        </section>
        <section class="section" aria-labelledby="overview-projects-title">
          <div class="section-head">
            <h2 id="overview-projects-title" data-i18n="Projetos"></h2>
            <button class="text-button" type="button" data-screen="projects" data-i18n="Ver todos"></button>
          </div>
          <div id="overview-projects" class="stack"></div>
        </section>
        <section id="usage" class="section" aria-labelledby="usage-title" hidden>
          <div class="section-head"><h2 id="usage-title" data-i18n="Uso das contas"></h2></div>
          <div id="accounts" class="stack"></div>
        </section>
      </section>

      <section id="projects" class="screen" aria-labelledby="projects-title" hidden>
        <div class="page-head"><h1 id="projects-title" data-i18n="Projetos"></h1><p id="projects-meta"></p></div>
        <label class="search">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
          <input type="search" id="project-search" autocomplete="off" data-placeholder="Buscar projeto ou sessão">
        </label>
        <div id="provider-filters" class="filters" role="group" data-label="Filtrar por ferramenta"></div>
        <div id="project-list" class="stack"></div>
      </section>

      <section id="activity" class="screen" aria-labelledby="activity-title" hidden>
        <div class="page-head"><h1 id="activity-title" data-i18n="Atividade"></h1><p data-i18n="Eventos recentes do escritório"></p></div>
        <div id="activity-list" class="stack"></div>
      </section>

      <section id="office" class="screen" aria-labelledby="office-title" hidden>
        <div class="page-head"><h1 id="office-title" data-i18n="Escritório"></h1><p data-i18n="Salas do seu escritório"></p></div>
        <div id="room-list" class="room-tabs" role="group" data-label="Selecionar sala"></div>
        <div id="room-view"></div>
      </section>

      <section id="project" class="screen" aria-labelledby="project-title" hidden>
        <div class="page-head">
          <button id="project-back" type="button" class="back text-button">
            <svg class="icon" aria-hidden="true"><use href="#icon-back"/></svg><span data-i18n="Voltar"></span>
          </button>
          <h1 id="project-title"></h1><p id="project-meta"></p>
        </div>
        <div id="project-sessions" class="stack"></div>
      </section>

      <section id="detail" class="screen" aria-labelledby="detail-title" hidden>
        <div class="page-head detail-head">
          <button id="back" type="button" class="back text-button">
            <svg class="icon" aria-hidden="true"><use href="#icon-back"/></svg><span data-i18n="Voltar"></span>
          </button>
          <h1 id="detail-title"></h1>
          <p id="detail-meta"></p>
        </div>
        <div id="sub-detail" class="stack" hidden></div>
        <div id="conversation"></div>
        <form id="composer">
          <p id="delivery" role="status" hidden></p>
          <div class="input-row">
            <textarea id="instruction" rows="2" maxlength="20000"></textarea>
            <button id="send" type="submit" data-i18n="Enviar" disabled></button>
          </div>
        </form>
      </section>
    </main>
    <nav id="navigation" class="navigation" data-label="Navegação principal">
      <button type="button" data-screen="overview" aria-current="page">
        <svg class="icon" aria-hidden="true"><use href="#icon-overview"/></svg><span data-i18n="Visão geral"></span>
      </button>
      <button type="button" data-screen="projects">
        <svg class="icon" aria-hidden="true"><use href="#icon-projects"/></svg><span data-i18n="Projetos"></span>
      </button>
      <button type="button" data-screen="activity">
        <svg class="icon" aria-hidden="true"><use href="#icon-activity"/></svg><span data-i18n="Atividade"></span>
      </button>
      <button type="button" data-screen="office">
        <svg class="icon" aria-hidden="true"><use href="#icon-office"/></svg><span data-i18n="Escritório"></span>
      </button>
    </nav>
  </div>
</body>
</html>
