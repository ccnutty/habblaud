<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habblaud</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <div class="workspace">
    <header class="masthead">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Habblaud</span>
      <span id="preview" class="preview" data-i18n="Prévia" hidden></span>
    </header>
    <p id="connection" class="connection" role="status" hidden></p>
    <main>
      <section id="office" aria-labelledby="office-title">
        <h1 id="office-title" data-i18n="Sessões"></h1>
        <div id="sessions" aria-live="polite"></div>
      </section>
      <section id="detail" aria-labelledby="detail-title" hidden>
        <div class="detail-head">
          <button id="back" type="button" class="back"><span aria-hidden="true">‹</span> <span data-i18n="Voltar"></span></button>
          <h1 id="detail-title"></h1>
          <p id="detail-meta"></p>
        </div>
        <div id="conversation"></div>
        <form id="composer">
          <p id="delivery" role="status" hidden></p>
          <div class="input-row">
            <textarea id="instruction" rows="2" maxlength="20000"></textarea>
            <button id="send" type="submit" data-i18n="Enviar" disabled></button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
